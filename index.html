<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockitecht: Mermaid Block Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colors */
            --bg-color: #f9fafb;
            --surface-color: #ffffff;
            --border-color: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --accent-color: #10b981;
            
            /* Grid */
            --grid-size: 20px;
            --grid-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Utility Classes */
        .flex { display: flex; }
        .flex-col { display: flex; flex-direction: column; }
        .flex-row { display: flex; flex-direction: row; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .p-2 { padding: 0.5rem; }
        .p-4 { padding: 1rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .hidden { display: none !important; }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background-color: var(--bg-color); }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        /* Header */
        header {
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            height: 60px;
        }

        #title-input {
            font-size: 1.125rem;
            font-weight: 600;
            border: none;
            outline: none;
            width: 300px;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Canvas Panel */
        #canvas-panel {
            flex: 1;
            position: relative;
            background-color: #f0f2f5;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            overflow: auto;
        }

        canvas {
            display: block;
            background: transparent;
        }

        /* Mermaid Panel */
        #mermaid-panel {
            width: 400px;
            background: var(--surface-color);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        #mermaid-output {
            flex: 1;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
            border: none;
            resize: none;
            outline: none;
            background: var(--bg-color);
        }

        #mermaid-preview {
            flex: 1;
            padding: 1rem;
            overflow: auto;
            border-top: 1px solid var(--border-color);
        }

        /* Overlays */
        .overlay-input {
            position: absolute;
            background: white;
            border: 1px solid var(--primary-color);
            padding: 4px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* HUD */
        #color-hud {
            position: absolute;
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 4px;
            z-index: 50;
            border: 1px solid var(--border-color);
        }
        .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Context Menu */
        #context-menu {
            position: absolute;
            background: white;
            min-width: 160px;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            z-index: 200;
            display: none;
        }
        .menu-item {
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .menu-item:hover { background: var(--bg-color); }
        .menu-divider { height: 1px; background: var(--border-color); margin: 4px 0; }

        /* Modal */
        #load-modal.hidden,
        #settings-modal.hidden { display: none !important; }

    </style>
</head>
<body>

    <!-- Header -->
    <header class="flex items-center justify-between px-4">
        <div class="flex items-center gap-4">
            <span class="text-xl font-bold">📦 Blockitecht</span>
            <input type="text" id="title-input" value="Architecture Diagram" placeholder="Diagram Title">
        </div>
        <div class="flex items-center gap-2">
            <button class="btn" id="btn-arrow-mode" title="Toggle Arrow Mode (A)">🔗</button>
            <button class="btn" id="btn-fit" title="Fit to View">⛶</button>
            <button class="btn" id="btn-clear" title="Clear Canvas">🗑️</button>
            <button class="btn" id="btn-settings" title="Settings">⚙️</button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <button class="btn" id="btn-load">📂 Load</button>
            <button class="btn" id="btn-copy">📋 Copy Mermaid</button>
            
        </div>
    </header>

    <!-- Main Workspace -->
    <main>
        <!-- Canvas Area -->
        <div id="canvas-panel">
            <canvas id="diagram-canvas"></canvas>
            
            <!-- Floating Text Editor for specific blocks -->
            <textarea id="text-editor" class="overlay-input"></textarea>

            <!-- Color HUD -->
            <div id="color-hud" class="hidden">
                <!-- Color swatches will be injected here -->
            </div>

            <!-- Context Menu -->
            <div id="context-menu"></div>
            
            <!-- Load Modal -->
            <div id="load-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: center; justify-content: center;">
                <div style="background: white; border-radius: 8px; padding: 24px; width: 600px; max-width: 90%;">
                    <h3 style="margin: 0 0 16px 0; font-size: 18px;">Load Mermaid Diagram</h3>
                    <textarea id="load-input" style="width: 100%; height: 300px; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-family: monospace; font-size: 14px; resize: vertical;" placeholder="Paste Mermaid block-beta code here..."></textarea>
                    <div style="display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end;">
                        <button class="btn" id="load-cancel">Cancel</button>
                        <button class="btn btn-primary" id="load-confirm">Load</button>
                    </div>
                </div>
            </div>
            
            <!-- Settings Modal -->
            <div id="settings-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: center; justify-content: center;">
                <div style="background: white; border-radius: 8px; padding: 24px; width: 400px; max-width: 90%;">
                    <h3 style="margin: 0 0 20px 0; font-size: 18px;">Settings</h3>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="setting-ghost-spaces" style="width: 18px; height: 18px; cursor: pointer;">
                            <div>
                                <div style="font-weight: 500; margin-bottom: 4px;">Show Ghost Spaces</div>
                                <div style="font-size: 13px; color: var(--text-secondary);">Display dashed outlines for space tokens in the layout</div>
                            </div>
                        </label>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-weight: 500; margin-bottom: 8px;">Mermaid Start Tag</label>
                        <select id="setting-start-tag" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px;">
                            <option value="block-beta">block-beta (recommended)</option>
                            <option value="block">block (standard)</option>
                        </select>
                        <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Choose the diagram header for generated Mermaid code</div>
                    </div>
                    
                    <div style="display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end;">
                        <button class="btn btn-primary" id="settings-close">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Mermaid Output & Preview -->
        <div id="mermaid-panel">
            <div class="panel-header">Mermaid Output</div>
            <textarea id="mermaid-output" readonly></textarea>
            
            <div class="panel-header">Preview</div>
            <div id="mermaid-preview"></div>
        </div>
    </main>

    <!-- External scripts -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'default' });
        window.mermaid = mermaid;
    </script>

    <!-- Application Logic -->
    <script>
        // --- CONSTANTS ---
        const GRID_SIZE = 20; // Grid snap size (px)
        const LOGICAL_COL_WIDTH = 100; // Logical column width (px)
        const LOGICAL_ROW_HEIGHT = 100; // Logical row height (px)

        // --- STATE ---
        const state = {
            blocks: [], // Array of block objects
            connections: [],
            title: "Architecture Diagram",
            settings: {
                showGhostSpaces: false,
                startTag: 'block-beta' // 'block' or 'block-beta'
            },
            view: {
                offset: { x: 50, y: 50 }, // Canvas scroll/offset
                scale: 1
            },
            interaction: {
                selectedBlockIds: new Set(),
                selectedConnectionIds: new Set(),
                mode: 'select', // 'select', 'arrow', 'pan'
                isDragging: false,
                isNavigating: false, // For middle click pan
                dragStart: { x: 0, y: 0 }, // Mouse start pos
                dragOffset: { x: 0, y: 0 }, // Offset from block top-left
                dragTargetId: null // ID of block being dragged
            },
            // Cache for row heights
            rowHeights: {} 
        };

        // --- DOM ELEMENTS ---
        const canvas = document.getElementById('diagram-canvas');
        const ctx = canvas.getContext('2d');
        const mermaidOutput = document.getElementById('mermaid-output');
        const mermaidPreview = document.getElementById('mermaid-preview');
        const btnClear = document.getElementById('btn-clear');
        const btnArrowMode = document.getElementById('btn-arrow-mode');

        // --- COORDINATE SYSTEMS ---
        
        // Convert screen coordinates to grid coordinates
        function pixelToGrid(x, y) {
            const row = Math.floor(y / LOGICAL_ROW_HEIGHT);
            const col = Math.floor(x / LOGICAL_COL_WIDTH);
            return { row: Math.max(0, row), col: Math.max(0, col) };
        }

        // Convert grid coordinates to screen coordinates
        function gridToPixel(row, col) {
            return {
                x: col * LOGICAL_COL_WIDTH,
                y: row * LOGICAL_ROW_HEIGHT,
                w: LOGICAL_COL_WIDTH,
                h: LOGICAL_ROW_HEIGHT
            };
        }

        // --- INITIALIZATION ---
        function init() {
            window.addEventListener('resize', handleResize);
            
            // Canvas Interaction
            canvas.addEventListener('mousedown', handleMouseDown);
            window.addEventListener('mousemove', handleMouseMove); // Window to catch drags outside canvas
            window.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            canvas.addEventListener('dblclick', handleDoubleClick);

            // Key commands
            window.addEventListener('keydown', handleKeyDown);

            // Title input
            const titleInput = document.getElementById('title-input');
            if (titleInput) {
                titleInput.addEventListener('input', (e) => {
                    state.title = e.target.value;
                    saveState();
                });
            }

            // Buttons
            if(btnClear) btnClear.addEventListener('click', clearCanvas);
            const btnLoad = document.getElementById('btn-load');
            if(btnLoad) btnLoad.addEventListener('click', loadFromMermaid);
            if(btnArrowMode) btnArrowMode.addEventListener('click', toggleArrowMode);
            
            const btnFit = document.getElementById('btn-fit');
            if(btnFit) btnFit.addEventListener('click', fitToView);
            
            const btnSettings = document.getElementById('btn-settings');
            if(btnSettings) btnSettings.addEventListener('click', openSettings);
            
            const btnCopy = document.getElementById('btn-copy');
            if(btnCopy) btnCopy.addEventListener('click', async () => {
                try {
                    // Try modern clipboard API first
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(mermaidOutput.value);
                    } else {
                        // Fallback to execCommand
                        mermaidOutput.select();
                        document.execCommand('copy');
                        window.getSelection().removeAllRanges();
                    }
                    const originalText = btnCopy.textContent;
                    btnCopy.textContent = '✅ Copied!';
                    setTimeout(() => btnCopy.textContent = originalText, 2000);
                } catch (err) {
                    console.error('Failed to copy:', err);
                    // Fallback method
                    try {
                        mermaidOutput.select();
                        document.execCommand('copy');
                        window.getSelection().removeAllRanges();
                        const originalText = btnCopy.textContent;
                        btnCopy.textContent = '✅ Copied!';
                        setTimeout(() => btnCopy.textContent = originalText, 2000);
                    } catch (fallbackErr) {
                        console.error('Fallback failed:', fallbackErr);
                        alert('Failed to copy to clipboard. Please copy manually from the Mermaid Output panel.');
                    }
                }
            });
            
            // Developer-only test runner removed from UI

            handleResize();
            
            // Load persisted state
            loadState();
            
            // Add default blocks if empty
            if (state.blocks.length === 0) {
                addBlock({ id: "A", text: "Client", row: 0, col: 0 });
                addBlock({ id: "B", text: "Server", row: 0, col: 2 });
            }
            
            // Initial Draw
            requestAnimationFrame(draw);
            updateOutput();
        }

        function handleResize() {
            if (!canvas.parentElement) return;
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }

        // --- HELPERS ---
        function generateId() {
            return 'block_' + Math.random().toString(36).substr(2, 9);
        }

        // Get color based on nesting level
        function getBlockColor(block) {
            // Calculate nesting depth
            let depth = 0;
            let current = block;
            while (current.parentId) {
                depth++;
                current = state.blocks.find(b => b.id === current.parentId);
                if (!current) break; // Safety check
            }
            
            // Color palette by depth
            const colors = [
                '#e0e7ff',  // Indigo-100 - top level
                '#dbeafe',  // Blue-100 - level 1
                '#bfdbfe',  // Blue-200 - level 2
                '#a5b4fc',  // Indigo-300 - level 3
            ];
            
            return colors[depth] || colors[colors.length - 1];
        }

        function addBlock(props) {
            const block = {
                id: props.id || generateId(),
                text: props.text || "New Block",
                row: props.row !== undefined ? props.row : 0,
                col: props.col !== undefined ? props.col : 0,
                rowSpan: props.rowSpan || 1,
                colSpan: props.colSpan || 1,
                parentId: props.parentId || null
            };
            state.blocks.push(block);
            return block;
        }

        function getBlockAt(x, y, selectParent = false) {
            // Check blocks in reverse Z-order
            for (let i = state.blocks.length - 1; i >= 0; i--) {
                const b = state.blocks[i];
                const px = gridToPixel(b.row, b.col);
                // Adjust for width/height spans
                px.w *= b.colSpan;
                px.h *= b.rowSpan;
                
                if (x >= px.x && x <= px.x + px.w && y >= px.y && y <= px.y + px.h) {
                    // If selectParent flag and block has parent, return parent instead
                    if (selectParent && b.parentId) {
                        const parent = state.blocks.find(p => p.id === b.parentId);
                        if (parent) return parent;
                    }
                    return b;
                }
            }
            return null;
        }

        function isBlockInsideBlock(inner, outer) {
            if (!inner || !outer || inner.id === outer.id) return false;
            
            const innerPx = gridToPixel(inner.row, inner.col);
            const outerPx = gridToPixel(outer.row, outer.col);
            
            const innerRight = innerPx.x + (innerPx.w * inner.colSpan);
            const innerBottom = innerPx.y + (innerPx.h * inner.rowSpan);
            const outerRight = outerPx.x + (outerPx.w * outer.colSpan);
            const outerBottom = outerPx.y + (outerPx.h * outer.rowSpan);
            
            return innerPx.x >= outerPx.x && innerRight <= outerRight &&
                   innerPx.y >= outerPx.y && innerBottom <= outerBottom;
        }

        function getChildBlocks(parentId) {
            return state.blocks.filter(b => b.parentId === parentId);
        }

        // Calculate nearest edge connection points between two blocks
        function getNearestEdgePoints(fromBlock, toBlock) {
            const fromPx = gridToPixel(fromBlock.row, fromBlock.col);
            const toPx = gridToPixel(toBlock.row, toBlock.col);
            
            const fromW = fromPx.w * fromBlock.colSpan;
            const fromH = fromPx.h * fromBlock.rowSpan;
            const toW = toPx.w * toBlock.colSpan;
            const toH = toPx.h * toBlock.rowSpan;
            
            // Centers
            const fromCX = fromPx.x + fromW / 2;
            const fromCY = fromPx.y + fromH / 2;
            const toCX = toPx.x + toW / 2;
            const toCY = toPx.y + toH / 2;
            
            // Calculate angle between centers
            const dx = toCX - fromCX;
            const dy = toCY - fromCY;
            
            // Find edge points on each block
            let startX, startY, endX, endY;
            
            // From block edge point
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal dominant
                if (dx > 0) {
                    // Right edge of from block
                    startX = fromPx.x + fromW - 5;
                    startY = fromCY;
                } else {
                    // Left edge of from block
                    startX = fromPx.x + 5;
                    startY = fromCY;
                }
            } else {
                // Vertical dominant
                if (dy > 0) {
                    // Bottom edge of from block
                    startX = fromCX;
                    startY = fromPx.y + fromH - 5;
                } else {
                    // Top edge of from block
                    startX = fromCX;
                    startY = fromPx.y + 5;
                }
            }
            
            // To block edge point
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal dominant
                if (dx > 0) {
                    // Left edge of to block
                    endX = toPx.x + 5;
                    endY = toCY;
                } else {
                    // Right edge of to block
                    endX = toPx.x + toW - 5;
                    endY = toCY;
                }
            } else {
                // Vertical dominant
                if (dy > 0) {
                    // Top edge of to block
                    endX = toCX;
                    endY = toPx.y + 5;
                } else {
                    // Bottom edge of to block
                    endX = toCX;
                    endY = toPx.y + toH - 5;
                }
            }
            
            return { startX, startY, endX, endY };
        }

        // Check if point is near a line segment
        function isPointNearLine(px, py, x1, y1, x2, y2, threshold = 8) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.sqrt(dx * dx + dy * dy);
            if (length === 0) return false;
            
            // Calculate distance from point to line
            const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (length * length)));
            const nearestX = x1 + t * dx;
            const nearestY = y1 + t * dy;
            const dist = Math.sqrt((px - nearestX) ** 2 + (py - nearestY) ** 2);
            
            return dist <= threshold;
        }

        function getConnectionAt(x, y) {
            for (const conn of state.connections) {
                const from = state.blocks.find(b => b.id === conn.fromId);
                const to = state.blocks.find(b => b.id === conn.toId);
                if (!from || !to) continue;
                
                const { startX, startY, endX, endY } = getNearestEdgePoints(from, to);
                
                if (isPointNearLine(x, y, startX, startY, endX, endY)) {
                    return conn;
                }
            }
            return null;
        }

        function clearCanvas() {
            state.blocks = [];
            state.connections = [];
            state.interaction.selectedBlockIds.clear();
            draw();
            updateOutput();
        }

        function toggleArrowMode() {
            state.interaction.mode = state.interaction.mode === 'arrow' ? 'select' : 'arrow';
            // Toggle visual state
            if(state.interaction.mode === 'arrow') {
                btnArrowMode.style.backgroundColor = '#dbeafe';
                btnArrowMode.style.borderColor = '#3b82f6';
            } else {
                btnArrowMode.style.backgroundColor = '';
                btnArrowMode.style.borderColor = '';
            }
            // Clear partial state
            state.interaction.arrowStartId = null;
        }

        function getResizeHandleAt(x, y) {
             for (const id of state.interaction.selectedBlockIds) {
                 const block = state.blocks.find(b => b.id === id);
                 if(!block) continue;
                 const px = gridToPixel(block.row, block.col);
                 const w = px.w * block.colSpan;
                 const h = px.h * block.rowSpan;
                 
                 // Handle Right Edge (Width) - simplified hit area
                 if (x >= px.x + w - 20 && x <= px.x + w + 10 && 
                     y >= px.y && y <= px.y + h) {
                     return { block, type: 'width' };
                 }
             }
             return null;
        }

        // --- INTERACTION HANDLERS ---
        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) - state.view.offset.x;
            const mouseY = (e.clientY - rect.top) - state.view.offset.y;

            // Handle right-click for context menu
            if (e.button === 2) {
                // Check for connection first
                const clickedConnection = getConnectionAt(mouseX, mouseY);
                if (clickedConnection) {
                    showConnectionContextMenu(e.clientX, e.clientY, clickedConnection);
                    return;
                }
                
                const clickedBlock = getBlockAt(mouseX, mouseY, e.altKey);
                if (clickedBlock) {
                    showContextMenu(e.clientX, e.clientY, clickedBlock);
                }
                return;
            }

            // 0. Hit Test Resize Handle
            const resizeHandle = getResizeHandleAt(mouseX, mouseY);
            if (resizeHandle) {
                state.interaction.resizeTarget = resizeHandle;
                state.interaction.isResizing = true;
                state.interaction.dragStart = { x: mouseX, y: mouseY }; // Track start
                draw();
                return;
            }

            // 1. Hit Test Block (Alt+Click selects parent)
            const clickedBlock = getBlockAt(mouseX, mouseY, e.altKey);
            
            // --- ARROW MODE ---
            if (state.interaction.mode === 'arrow') {
                 if (clickedBlock) {
                     if (!state.interaction.arrowStartId) {
                         state.interaction.arrowStartId = clickedBlock.id;
                     } else {
                         // Complete connection
                         if (state.interaction.arrowStartId !== clickedBlock.id) {
                             state.connections.push({
                                 _id: 'conn_' + Math.random(),
                                 fromId: state.interaction.arrowStartId,
                                 toId: clickedBlock.id,
                                 arrowType: '-->'
                             });
                             updateOutput();
                         }
                         state.interaction.arrowStartId = null;
                     }
                 } else {
                     // Reset if clicked empty
                     state.interaction.arrowStartId = null;
                 }
                 draw();
                 return;
            }

            // --- SELECT MODE ---
            // Check for connection click
            const clickedConnection = getConnectionAt(mouseX, mouseY);
            if (clickedConnection) {
                state.interaction.selectedBlockIds.clear();
                state.interaction.selectedConnectionIds.clear();
                state.interaction.selectedConnectionIds.add(clickedConnection._id);
                draw();
                return;
            }
            
            if (clickedBlock) {
                // Selection logic
                if (!e.shiftKey) {
                    // Handle single selection
                    if (!state.interaction.selectedBlockIds.has(clickedBlock.id)) {
                        state.interaction.selectedBlockIds.clear();
                    }
                }
                state.interaction.selectedBlockIds.add(clickedBlock.id);
                state.interaction.dragTargetId = clickedBlock.id;
                state.interaction.isDragging = true;
                
                // Calculate offset from block origin
                const blockPx = gridToPixel(clickedBlock.row, clickedBlock.col);
                state.interaction.dragOffset = {
                    x: mouseX - blockPx.x,
                    y: mouseY - blockPx.y
                };
            } else {
                // Handle background click
                state.interaction.selectedBlockIds.clear();
                
                const gridPos = pixelToGrid(mouseX, mouseY);
                const newBlock = addBlock({
                    text: 'New Block',
                    row: gridPos.row,
                    col: gridPos.col,
                    rowSpan: 1,
                    colSpan: 1
                });
                
                state.interaction.selectedBlockIds.add(newBlock.id);
                state.interaction.dragTargetId = newBlock.id; // Treat as drag to resize? Or just place?
                // For now just place. Drag creation would need separate 'creating' state.
                state.interaction.isDragging = false; 
                updateOutput();
            }

            draw();
        }

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) - state.view.offset.x; 
            const mouseY = (e.clientY - rect.top) - state.view.offset.y;
            
            // Check cursor style
            const resizeHandle = getResizeHandleAt(mouseX, mouseY);
            if (resizeHandle) {
                canvas.style.cursor = 'ew-resize';
            } else if (state.interaction.mode === 'arrow') {
                canvas.style.cursor = 'crosshair';
            } else if(getBlockAt(mouseX, mouseY)) {
                canvas.style.cursor = 'move';
            } else {
                canvas.style.cursor = 'default';
            }

            if (state.interaction.isResizing && state.interaction.resizeTarget) {
                 const block = state.interaction.resizeTarget.block;
                 const blockPx = gridToPixel(block.row, block.col);
                 // Dist from left edge
                 const dist = mouseX - blockPx.x;
                 // Convert to cols, min 1
                 const newColSpan = Math.max(1, Math.round(dist / LOGICAL_COL_WIDTH));
                 if (newColSpan !== block.colSpan) {
                     block.colSpan = newColSpan;
                     draw();
                 }
                 return;
            }

            if (!state.interaction.isDragging || !state.interaction.dragTargetId) return;

            // Calculate new top-left for the block
            const newX = mouseX - state.interaction.dragOffset.x;
            const newY = mouseY - state.interaction.dragOffset.y;

            // Snap coordinates to grid
            const newCol = Math.max(0, Math.round(newX / LOGICAL_COL_WIDTH));
            const newRow = Math.max(0, Math.round(newY / LOGICAL_ROW_HEIGHT));

            // Update block position
            const block = state.blocks.find(b => b.id === state.interaction.dragTargetId);
            if (block) {
                // Calculate delta for moving children
                const deltaCol = newCol - block.col;
                const deltaRow = newRow - block.row;
                
                // Update grid coordinates
                block.col = newCol;
                block.row = newRow;
                
                // Move all children recursively
                function moveChildren(parentId, dCol, dRow) {
                    const children = getChildBlocks(parentId);
                    children.forEach(child => {
                        child.col += dCol;
                        child.row += dRow;
                        moveChildren(child.id, dCol, dRow);
                    });
                }
                moveChildren(block.id, deltaCol, deltaRow);
            }

            draw();
        }

        function handleMouseUp(e) {
            if (state.interaction.isResizing) {
                state.interaction.isResizing = false;
                state.interaction.resizeTarget = null;
                updateOutput();
            }
            
            // Check for nesting on drop
            if (state.interaction.isDragging && state.interaction.dragTargetId) {
                const droppedBlock = state.blocks.find(b => b.id === state.interaction.dragTargetId);
                if (droppedBlock) {
                    // Find potential parent (larger block that contains the dropped block)
                    for (const potentialParent of state.blocks) {
                        if (potentialParent.id === droppedBlock.id) continue;
                        if (potentialParent.parentId === droppedBlock.id) continue; // Can't nest in own child
                        
                        if (isBlockInsideBlock(droppedBlock, potentialParent)) {
                            droppedBlock.parentId = potentialParent.id;
                            break;
                        }
                    }
                    // If not inside any block, clear parent
                    if (!state.blocks.some(b => b.id !== droppedBlock.id && isBlockInsideBlock(droppedBlock, b))) {
                        droppedBlock.parentId = null;
                    }
                }
            }
            
            state.interaction.isDragging = false;
            state.interaction.dragTargetId = null;
            draw();
            updateOutput();
        }

        function handleKeyDown(e) {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                deleteSelectedBlocks();
                // Also delete selected connections
                if (state.interaction.selectedConnectionIds.size > 0) {
                    state.connections = state.connections.filter(c => !state.interaction.selectedConnectionIds.has(c._id));
                    state.interaction.selectedConnectionIds.clear();
                    updateOutput();
                    draw();
                }
            } else if (e.key === 'a' || e.key === 'A') {
                if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') {
                    toggleArrowMode();
                }
            }
        }

        function handleDoubleClick(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) - state.view.offset.x;
            const mouseY = (e.clientY - rect.top) - state.view.offset.y;
            
            // Check for connection first
            const connection = getConnectionAt(mouseX, mouseY);
            if (connection) {
                const newLabel = prompt('Enter connection label:', connection.label || '');
                if (newLabel !== null) {
                    connection.label = newLabel;
                    updateOutput();
                    draw();
                }
                return;
            }
            
            const block = getBlockAt(mouseX, mouseY, e.altKey);
            if (block) {
                showTextEditor(block);
            }
        }
        
        function showConnectionContextMenu(x, y, connection) {
            const menu = document.getElementById('context-menu');
            if (!menu) return;
            
            let menuHTML = '';
            menuHTML += '<div class="menu-item" data-action="edit-label">Edit Label</div>';
            menuHTML += '<div class="menu-item" data-action="reverse-arrow">Reverse Arrow</div>';
            menuHTML += '<div class="menu-divider"></div>';
            menuHTML += '<div class="menu-item" data-action="delete-conn">Delete Connection</div>';
            
            menu.innerHTML = menuHTML;
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.style.display = 'block';
            
            const handleMenuClick = (e) => {
                const action = e.target.dataset.action;
                if (action === 'delete-conn') {
                    state.connections = state.connections.filter(c => c._id !== connection._id);
                    state.interaction.selectedConnectionIds.clear();
                } else if (action === 'edit-label') {
                    const newLabel = prompt('Enter connection label:', connection.label || '');
                    if (newLabel !== null) {
                        connection.label = newLabel;
                    }
                } else if (action === 'reverse-arrow') {
                    const temp = connection.fromId;
                    connection.fromId = connection.toId;
                    connection.toId = temp;
                }
                updateOutput();
                draw();
                hideContextMenu();
            };
            
            const hideContextMenu = () => {
                menu.style.display = 'none';
                menu.removeEventListener('click', handleMenuClick);
                document.removeEventListener('click', hideContextMenu);
            };
            
            menu.addEventListener('click', handleMenuClick);
            setTimeout(() => document.addEventListener('click', hideContextMenu), 10);
        }

        function showContextMenu(x, y, block) {
            const menu = document.getElementById('context-menu');
            if (!menu) return;
            
            // Build menu items
            const isMultiSelect = state.interaction.selectedBlockIds.size > 1;
            let menuHTML = '';
            
            if (isMultiSelect) {
                menuHTML += '<div class="menu-item" data-action="merge">Merge Blocks</div>';
            } else {
                menuHTML += '<div class="menu-item" data-action="split-h">Split Horizontally</div>';
                menuHTML += '<div class="menu-item" data-action="split-v">Split Vertically</div>';
                menuHTML += '<div class="menu-divider"></div>';
            }
            menuHTML += '<div class="menu-item" data-action="delete">Delete Block(s)</div>';
            
            menu.innerHTML = menuHTML;
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.style.display = 'block';
            
            // Handle clicks
            const handleMenuClick = (e) => {
                const action = e.target.dataset.action;
                if (action === 'delete') {
                    deleteSelectedBlocks();
                } else if (action === 'merge') {
                    mergeSelectedBlocks();
                } else if (action === 'split-h') {
                    splitBlock(block, 'horizontal');
                } else if (action === 'split-v') {
                    splitBlock(block, 'vertical');
                }
                hideContextMenu();
            };
            
            const hideContextMenu = () => {
                menu.style.display = 'none';
                menu.removeEventListener('click', handleMenuClick);
                document.removeEventListener('click', hideContextMenu);
            };
            
            menu.addEventListener('click', handleMenuClick);
            setTimeout(() => document.addEventListener('click', hideContextMenu), 10);
        }

        function deleteSelectedBlocks() {
            if (state.interaction.selectedBlockIds.size > 0) {
                state.blocks = state.blocks.filter(b => !state.interaction.selectedBlockIds.has(b.id));
                state.interaction.selectedBlockIds.clear();
                draw();
                updateOutput();
            }
        }

        function mergeSelectedBlocks() {
            if (state.interaction.selectedBlockIds.size < 2) return;
            
            // Find bounds of selected blocks
            let minRow = Infinity, minCol = Infinity, maxRow = -Infinity, maxCol = -Infinity;
            const selectedBlocks = state.blocks.filter(b => state.interaction.selectedBlockIds.has(b.id));
            
            selectedBlocks.forEach(b => {
                minRow = Math.min(minRow, b.row);
                minCol = Math.min(minCol, b.col);
                maxRow = Math.max(maxRow, b.row + b.rowSpan);
                maxCol = Math.max(maxCol, b.col + b.colSpan);
            });
            
            // Create parent block
            const parentBlock = addBlock({
                text: 'Container',
                row: minRow,
                col: minCol,
                rowSpan: maxRow - minRow,
                colSpan: maxCol - minCol
            });
            
            // Set selected blocks as children
            selectedBlocks.forEach(b => {
                b.parentId = parentBlock.id;
            });
            
            state.interaction.selectedBlockIds.clear();
            state.interaction.selectedBlockIds.add(parentBlock.id);
            draw();
            updateOutput();
        }

        function splitBlock(block, direction) {
            if (!block) return;
            
            if (direction === 'horizontal') {
                // Split into two rows
                const halfHeight = Math.max(1, Math.floor(block.rowSpan / 2));
                
                block.rowSpan = halfHeight;
                
                const newBlock = addBlock({
                    text: 'Split Block',
                    row: block.row + halfHeight,
                    col: block.col,
                    rowSpan: block.rowSpan,
                    colSpan: block.colSpan,
                    parentId: block.parentId
                });
            } else {
                // Split into two columns
                const halfWidth = Math.max(1, Math.floor(block.colSpan / 2));
                
                block.colSpan = halfWidth;
                
                const newBlock = addBlock({
                    text: 'Split Block',
                    row: block.row,
                    col: block.col + halfWidth,
                    rowSpan: block.rowSpan,
                    colSpan: block.colSpan,
                    parentId: block.parentId
                });
            }
            
            draw();
            updateOutput();
        }

        function showTextEditor(block) {
            const px = gridToPixel(block.row, block.col);
            const editor = document.getElementById('text-editor');
            
            // Position relative to canvas-panel
            // Canvas has offset applied via translate in draw(), but DOM element needs explict left/top
            const left = px.x + state.view.offset.x;
            const top = px.y + state.view.offset.y;
            const width = px.w * block.colSpan;
            const height = px.h * block.rowSpan;
            
            editor.style.display = 'block';
            editor.style.left = left + 'px';
            editor.style.top = top + 'px';
            editor.style.width = width + 'px';
            editor.style.height = height + 'px';
            editor.value = block.text;
            editor.focus();
            
            // One-time save handler
            const save = () => {
                block.text = editor.value;
                editor.style.display = 'none';
                draw();
                updateOutput();
                editor.removeEventListener('blur', save); // Cleanup matches logic
            };
            editor.onblur = save; // Simple assignment to prevent duplicate listeners
            
            // Handle Enter to save
            editor.onkeydown = (e) => {
                if(e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    editor.blur();
                }
            };
        }

        // --- RENDER LOOP ---
        function draw() {
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(state.view.offset.x, state.view.offset.y);
            
            // Draw background grid
            // ...

            // Draw Blocks
            state.blocks.forEach(block => drawBlock(ctx, block));
            
            // Draw Ghost Spaces if enabled
            if (state.settings.showGhostSpaces) {
                drawGhostSpaces(ctx);
            }
            
            // Draw Selection Outline
            if (state.interaction.selectedBlockIds.size > 0) {
                state.blocks.forEach(block => {
                    if (state.interaction.selectedBlockIds.has(block.id)) {
                        drawSelectionOutline(ctx, block);
                    }
                });
            }

            // Draw Connections
            state.connections.forEach(conn => drawConnection(ctx, conn));
            
            // Draw temporary arrow line if creating
            if (state.interaction.arrowStartId && state.interaction.mousePos) { // mousePos tracking needed
                 // ...
            }
            
            ctx.restore();
        }

        function drawBlock(ctx, block) {
            const px = gridToPixel(block.row, block.col);
            const w = px.w * block.colSpan;
            const h = px.h * block.rowSpan;
            
            // Check if this block is a parent
            const children = getChildBlocks(block.id);
            const isParent = children.length > 0;
            const isChild = block.parentId !== null;
            
            // Different padding for parents vs children
            const padding = isChild ? 15 : 5;

            // For parent blocks, draw a subtle background frame first
            if (isParent) {
                ctx.fillStyle = '#e0e7ff'; // Light indigo background for parents
                ctx.strokeStyle = '#818cf8'; // Indigo border
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(px.x + 2, px.y + 2, w - 4, h - 4, 10);
                ctx.fill();
                ctx.stroke();
            }

            // Body
            ctx.fillStyle = getBlockColor(block);
            ctx.beginPath();
            ctx.roundRect(px.x + padding, px.y + padding, w - (padding * 2), h - (padding * 2), 8);
            ctx.fill();
            
            // Border
            ctx.strokeStyle = isChild ? '#6366f1' : (isParent ? '#818cf8' : '#9ca3af');
            ctx.lineWidth = isChild ? 3 : 2;
            ctx.stroke();
            
            // Text
            ctx.fillStyle = '#1f2937'; // Gray-800
            ctx.font = '14px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(block.text, px.x + w/2, px.y + h/2);
        }
        
        function drawGhostSpaces(ctx) {
            // Determine grid dimensions
            let maxCol = 0;
            let maxRow = 0;
            state.blocks.forEach(b => {
                if (!b.parentId) { // Only count top-level blocks
                    maxCol = Math.max(maxCol, b.col + b.colSpan);
                    maxRow = Math.max(maxRow, b.row + b.rowSpan);
                }
            });
            
            if (maxCol === 0 || maxRow === 0) return;
            
            // Build grid to find empty spaces
            const grid = [];
            for (let r = 0; r < maxRow; r++) {
                grid[r] = new Array(maxCol).fill(null);
            }
            
            state.blocks.forEach(b => {
                if (b.parentId) return; // Skip nested blocks
                for (let r = 0; r < b.rowSpan; r++) {
                    for (let c = 0; c < b.colSpan; c++) {
                        if (grid[b.row + r] && grid[b.row + r][b.col + c] !== undefined) {
                            grid[b.row + r][b.col + c] = 'OCCUPIED';
                        }
                    }
                }
            });
            
            // Draw dashed boxes for empty spaces
            ctx.save();
            ctx.strokeStyle = '#9ca3af';
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 1;
            ctx.fillStyle = 'rgba(156, 163, 175, 0.1)';
            
            for (let r = 0; r < maxRow; r++) {
                for (let c = 0; c < maxCol; c++) {
                    if (grid[r][c] === null) {
                        const px = gridToPixel(r, c);
                        ctx.strokeRect(px.x + 2, px.y + 2, px.w - 4, px.h - 4);
                        ctx.fillRect(px.x + 2, px.y + 2, px.w - 4, px.h - 4);
                        
                        // Add "space" label
                        ctx.fillStyle = '#6b7280';
                        ctx.font = '11px Inter';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('space', px.x + px.w/2, px.y + px.h/2);
                        ctx.fillStyle = 'rgba(156, 163, 175, 0.1)';
                    }
                }
            }
            
            ctx.restore();
        }

        function drawSelectionOutline(ctx, block) {
            const px = gridToPixel(block.row, block.col);
            const w = px.w * block.colSpan;
            const h = px.h * block.rowSpan;
            
            const isChild = block.parentId !== null;
            const padding = isChild ? 15 : 5;
            
            // Resize Handle (Right Edge indicator)
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.roundRect(px.x + w - padding - 12, px.y + h/2 - 15, 6, 30, 3);
            ctx.fill();
            
            ctx.strokeStyle = '#3b82f6'; // Blue-500
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(px.x + padding - 2, px.y + padding - 2, w - (padding * 2) + 4, h - (padding * 2) + 4, 10);
            ctx.stroke();
        }

        function drawConnection(ctx, conn) {
            const from = state.blocks.find(b => b.id === conn.fromId);
            const to = state.blocks.find(b => b.id === conn.toId);
            if (!from || !to) return;
            
            const { startX, startY, endX, endY } = getNearestEdgePoints(from, to);
            
            // Check if selected
            const isSelected = state.interaction.selectedConnectionIds.has(conn._id);
            
            ctx.strokeStyle = isSelected ? '#3b82f6' : '#374151';
            ctx.lineWidth = isSelected ? 3 : 2;
            
            // Draw line
            ctx.setLineDash([]);
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            
            // Draw arrow head
            const angle = Math.atan2(endY - startY, endX - startX);
            const arrowLength = 12;
            const arrowWidth = 8;
            
            ctx.fillStyle = isSelected ? '#3b82f6' : '#374151';
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(
                endX - arrowLength * Math.cos(angle) - arrowWidth * Math.sin(angle),
                endY - arrowLength * Math.sin(angle) + arrowWidth * Math.cos(angle)
            );
            ctx.lineTo(
                endX - arrowLength * Math.cos(angle) + arrowWidth * Math.sin(angle),
                endY - arrowLength * Math.sin(angle) - arrowWidth * Math.cos(angle)
            );
            ctx.closePath();
            ctx.fill();
            
            // Draw label if exists
            if (conn.label) {
                const midX = (startX + endX) / 2;
                const midY = (startY + endY) / 2;
                
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 1;
                const textWidth = ctx.measureText(conn.label).width;
                ctx.fillRect(midX - textWidth / 2 - 4, midY - 10, textWidth + 8, 20);
                ctx.strokeRect(midX - textWidth / 2 - 4, midY - 10, textWidth + 8, 20);
                
                ctx.fillStyle = '#374151';
                ctx.font = '12px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(conn.label, midX, midY);
            }
        }

        // --- MERMAID GENERATOR ---
        function generateMermaidBlockDiagram() {
            if (state.blocks.length === 0) return '';

            // 1. Determine Grid Dimensions
            let maxCol = 0;
            let maxRow = 0;
            state.blocks.forEach(b => {
                maxCol = Math.max(maxCol, b.col + b.colSpan);
                maxRow = Math.max(maxRow, b.row + b.rowSpan);
            });
            
            // Columns count
            const columns = maxCol;

            // 2. Build Grid Map to handle spaces
            const grid = []; // 2D array [row][col] -> blockId or null
            for (let r = 0; r < maxRow; r++) {
                grid[r] = new Array(columns).fill(null);
            }

            state.blocks.forEach(b => {
                // Skip nested blocks during top-level generation
                if (b.parentId) return; 

                for (let r = 0; r < b.rowSpan; r++) {
                    for (let c = 0; c < b.colSpan; c++) {
                        if (grid[b.row + r] && grid[b.row + r][b.col + c] !== undefined) {
                            grid[b.row + r][b.col + c] = (r === 0 && c === 0) ? b : 'OCCUPIED';
                        }
                    }
                }
            });

            // 3. Generate Syntax
            const lines = [];
            lines.push(state.settings.startTag || 'block-beta');
            lines.push(`columns ${columns}`);

            // Helper to generate a block and its children recursively
            function generateBlockWithChildren(block, indent = '') {
                const blockLines = [];
                const children = getChildBlocks(block.id);
                
                if (children.length > 0) {
                    // Parent block with children
                    let headerLine = indent + `block:${block.id}`;
                    if (block.colSpan > 1) {
                        headerLine += `:${block.colSpan}`;
                    }
                    blockLines.push(headerLine);
                    blockLines.push(indent + `  ${block.id}["${block.text}"]`);
                    
                    // Add children
                    children.forEach(child => {
                        const childLines = generateBlockWithChildren(child, indent + '  ');
                        blockLines.push(...childLines);
                    });
                    
                    blockLines.push(indent + 'end');
                } else {
                    // Simple block
                    let line = indent + `${block.id}["${block.text}"]`;
                    if (block.colSpan > 1) {
                        line += `:${block.colSpan}`;
                    }
                    blockLines.push(line);
                }
                
                return blockLines;
            }

            for (let r = 0; r < maxRow; r++) {
                let colIndex = 0;
                while (colIndex < columns) {
                    const cell = grid[r][colIndex];
                    
                    if (cell === 'OCCUPIED') {
                        // Skip, handled by the main block
                        colIndex++;
                        continue;
                    }
                    
                    if (cell && typeof cell === 'object') {
                        // It's a block
                        const b = cell;
                        const blockLines = generateBlockWithChildren(b);
                        lines.push(...blockLines);
                        
                        colIndex += b.colSpan;
                    } else {
                        // It's a space (null)
                        // Count consecutive spaces
                        let spaceCount = 0;
                        while (colIndex + spaceCount < columns && grid[r][colIndex + spaceCount] === null) {
                            spaceCount++;
                        }
                        
                        if (spaceCount > 0) {
                            if (spaceCount === 1) {
                                lines.push('space');
                            } else {
                                lines.push(`space:${spaceCount}`);
                            }
                            colIndex += spaceCount;
                        } else {
                            colIndex++; 
                        }
                    }
                }
            }

            // 4. Add Connections
            if (state.connections.length > 0) {
                state.connections.forEach(c => {
                    const arrow = c.arrowType || '-->';
                    let line;
                    if (c.label) {
                        // Format: A-- "label" -->B
                        line = `${c.fromId}-- "${c.label}" ${arrow}${c.toId}`;
                    } else {
                        // Format: A-->B
                        line = `${c.fromId} ${arrow} ${c.toId}`;
                    }
                    lines.push(line);
                });
            }

            return lines.join('\n');
        }

        // --- MERMAID PARSER ---
        function parseBlockDiagramInput(input) {
            const lines = input.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('%%'));
            if (!lines.length) return;

            // Parser state
            const newBlocks = [];
            let columns = 1; // Default
            let currentRow = 0;
            let currentCol = 0;
            
            // Add block to state and update grid cursor
            function placeBlock(block, width) {
                block.row = currentRow;
                block.col = currentCol;
                newBlocks.push(block);
                currentCol += width;
                if (currentCol >= columns) {
                    currentCol = 0;
                    currentRow++;
                }
            }
            
            // Process line-by-line
            
            for (const line of lines) {
                if (line.startsWith('block-beta')) continue;
                if (line.startsWith('columns')) {
                    const parts = line.split(/\s+/);
                    if (parts[1]) columns = parseInt(parts[1], 10);
                    continue;
                }
                
                // 1. Connection: A --> B
                if (line.includes('-->') || line.includes('---') || line.includes('<--')) {
                    // Parse connection syntax
                    // Extract connection parts
                    let type = '-->';
                    if (line.includes('---')) type = '---';
                    if (line.includes('<--')) type = '<--';
                    
                    const parts = line.split(type);
                    if (parts.length === 2) {
                        let from = parts[0].trim();
                        let to = parts[1].trim();
                        let label = "";
                        
                        if (to.startsWith('|')) {
                           const labelMatch = to.match(/^\|"?(.*?)"?\|\s*(.*)/);
                           if (labelMatch) {
                               label = labelMatch[1];
                               to = labelMatch[2];
                           }
                        }
                        
                        state.connections.push({
                            _id: 'conn_' + Math.random(),
                            fromId: from,
                            toId: to,
                            arrowType: type,
                            label: label
                        });
                    }
                    continue;
                }
                
                // 2. Space: space or space:N
                if (line.startsWith('space')) {
                    let width = 1;
                    if (line.includes(':')) {
                        width = parseInt(line.split(':')[1], 10) || 1;
                    }
                    currentCol += width;
                    if (currentCol >= columns) {
                        currentCol = 0;
                        currentRow++;
                    }
                    continue;
                }

                // 3. Block: id["label"]:width or id
                // Regex for block definition
                const blockRegex = /^([a-zA-Z0-9_]+)(?:\["([^"]*)"\])?(?::(\d+))?$/;
                const match = line.match(blockRegex);
                
                if (match) {
                    const id = match[1];
                    const label = match[2] || id;
                    const width = match[3] ? parseInt(match[3], 10) : 1;
                    
                    placeBlock({
                        id: id,
                        text: label,
                        colSpan: width,
                        rowSpan: 1, // Default
                        parentId: null
                    }, width);
                }
            }
            
            // Update State
            state.blocks = newBlocks;
            draw();
        }

        function tokenize(text) {
             // TBD: Robust tokenization if multi-block-per-line support is needed
             // Currently assuming one statement per line for simplified parsing
             return text;
        }

        function loadFromMermaid() {
            const modal = document.getElementById('load-modal');
            const input = document.getElementById('load-input');
            const confirmBtn = document.getElementById('load-confirm');
            const cancelBtn = document.getElementById('load-cancel');
            
            if (!modal) return;
            
            // Show modal
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            input.value = '';
            input.focus();
            
            // Handle confirm
            const handleConfirm = () => {
                const code = input.value.trim();
                if (code) {
                    parseBlockDiagramInput(code);
                    updateOutput();
                }
                modal.classList.add('hidden');
                modal.style.display = 'none';
                cleanup();
            };
            
            // Handle cancel
            const handleCancel = () => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
                cleanup();
            };
            
            // Cleanup listeners
            const cleanup = () => {
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
                modal.removeEventListener('click', handleModalClick);
            };
            
            // Click outside to close
            const handleModalClick = (e) => {
                if (e.target === modal) handleCancel();
            };
            
            confirmBtn.addEventListener('click', handleConfirm);
            cancelBtn.addEventListener('click', handleCancel);
            modal.addEventListener('click', handleModalClick);
        }

        function updateOutput() {
            const code = generateMermaidBlockDiagram();
            mermaidOutput.value = code;
            
            // Render Preview
            mermaidPreview.innerHTML = '';
            // Render Preview
            mermaid.render('preview-svg', code).then(result => {
                mermaidPreview.innerHTML = result.svg;
            }).catch(err => {
                // Using simple pre for error
                console.warn(err); 
                mermaidPreview.innerHTML = `<div style="color:red; font-size: 12px; padding: 10px;">Rendering... (or syntax error)</div>`;
            });
            
            saveState();
        }
        
        // --- STATE PERSISTENCE ---
        function saveState() {
            try {
                const persistedState = {
                    blocks: state.blocks,
                    connections: state.connections,
                    title: state.title,
                    settings: state.settings
                };
                localStorage.setItem('blockitecht_state', JSON.stringify(persistedState));
            } catch (e) {
                console.warn('Failed to save state:', e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('blockitecht_state');
                if (saved) {
                    const persistedState = JSON.parse(saved);
                    if (persistedState.blocks) state.blocks = persistedState.blocks;
                    if (persistedState.connections) state.connections = persistedState.connections;
                    if (persistedState.title) {
                        state.title = persistedState.title;
                        const titleInput = document.getElementById('title-input');
                        if (titleInput) titleInput.value = persistedState.title;
                    }
                    if (persistedState.settings) {
                        state.settings = { ...state.settings, ...persistedState.settings };
                    }
                }
            } catch (e) {
                console.warn('Failed to load state:', e);
            }
        }

        function fitToView() {
            if (state.blocks.length === 0) return;
            // Find bounds
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            state.blocks.forEach(b => {
                let px = gridToPixel(b.row, b.col);
                minX = Math.min(minX, px.x);
                minY = Math.min(minY, px.y);
                maxX = Math.max(maxX, px.x + px.w * b.colSpan);
                maxY = Math.max(maxY, px.y + px.h * b.rowSpan);
            });
            
            const margin = 50;
            const contentW = maxX - minX + (margin*2);
            const contentH = maxY - minY + (margin*2);
            
            const canvasW = canvas.width;
            const canvasH = canvas.height;
            
            // Center
            state.view.offset.x = (canvasW - contentW)/2 - minX + margin;
            state.view.offset.y = (canvasH - contentH)/2 - minY + margin;
            
            draw();
        }
        
        function openSettings() {
            const modal = document.getElementById('settings-modal');
            if (!modal) return;
            
            // Populate current settings
            const ghostSpacesCheckbox = document.getElementById('setting-ghost-spaces');
            const startTagSelect = document.getElementById('setting-start-tag');
            
            if (ghostSpacesCheckbox) ghostSpacesCheckbox.checked = state.settings.showGhostSpaces;
            if (startTagSelect) startTagSelect.value = state.settings.startTag || 'block-beta';
            
            // Show modal
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            
            // Handle setting changes
            const handleGhostSpacesChange = () => {
                state.settings.showGhostSpaces = ghostSpacesCheckbox.checked;
                saveState();
                draw();
            };
            
            const handleStartTagChange = () => {
                state.settings.startTag = startTagSelect.value;
                saveState();
                updateOutput();
            };
            
            const handleClose = () => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
                ghostSpacesCheckbox.removeEventListener('change', handleGhostSpacesChange);
                startTagSelect.removeEventListener('change', handleStartTagChange);
                closeBtn.removeEventListener('click', handleClose);
                modal.removeEventListener('click', handleModalClick);
            };
            
            const handleModalClick = (e) => {
                if (e.target === modal) handleClose();
            };
            
            const closeBtn = document.getElementById('settings-close');
            if (ghostSpacesCheckbox) ghostSpacesCheckbox.addEventListener('change', handleGhostSpacesChange);
            if (startTagSelect) startTagSelect.addEventListener('change', handleStartTagChange);
            if (closeBtn) closeBtn.addEventListener('click', handleClose);
            modal.addEventListener('click', handleModalClick);
        }

        // Boot
        init();

        // Export for testing/debugging
        window.bte = { state, generateMermaidBlockDiagram, addBlock, parseBlockDiagramInput };
        if (typeof module !== 'undefined' && module.exports) {
           // For Node/Test environment where window structure might differ or we want direct access
           // But since test.js uses vm context where window is the global, 
           // assigning to window.bte is enough IF we check window.bte
        }

    </script>
